services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/headscale
      - ./config:/etc/headscale:ro
    # Headscale listens on 8080 inside the container; the panel reaches it over
    # the internal docker network so no host port mapping is needed by default.
    # Add (e.g.) "- 127.0.0.1:8081:8080" here if you want host-side access for
    # diagnostics, or expose 80/443 here if Headscale is doing its own TLS.
    command: serve

  panel:
    # Default: pull the published image. Pin a specific calendar version (e.g.
    # :2026.05.02) for production; :latest is fine for tracking the most recent build.
    image: ghcr.io/tinyhomelab-io/headscale-panel:latest
    # To build from source instead, comment the `image:` line above and uncomment:
    # build: ./panel
    container_name: headscale-panel
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./panel-data:/data
      # Headscale's data dir, for direct-DB bypass operations (IP edit, change user, etc.)
      - ./data:/headscale-data:rw
      # Headscale's config dir, for the Settings/DNS pages to manage config.yaml.
      - ./config:/headscale-config:rw
      # Docker socket so the panel can restart Headscale after a config or direct-DB write.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
